<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Koperasi</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --primary: #1e90ff;
  --primary-dark: #0f3057;
  --card: #ffffff;
  --bg: #f4f6f9;
  --text: #1f2937;
  --muted: #6b7280;
  --shadow: 0 3px 10px rgba(0,0,0,0.08);
  --radius: 12px;
}

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ===== HEADER ===== */
header {
  background: linear-gradient(to right, var(--primary), var(--primary-dark));
  color: white;
  padding: 14px 16px;
  font-size: 17px;
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  position: sticky;
  top: 0;
  z-index: 100;
}

header button {
  background: #ffc107;
  color: #1f2937;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: 0.2s;
}

header button:hover {
  background: #ffb300;
  transform: scale(1.05);
}

.menu-btn {
  background: transparent;
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
  padding: 2px 4px;
  margin-right: 8px;
}

/* ===== CONTAINER ===== */
.container {
  padding: 16px;
  max-width: 1100px;
  margin: 0 auto;
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

@media (min-width: 700px) {
  .grid { grid-template-columns: 1fr 1fr; }
  .container { padding: 10px; }
}

/* ===== CARD ===== */
.card {
  background: var(--card);
  padding: 10px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid #e5e7eb;
}

.card h3 {
  margin: 0 0 14px 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
/* ===== TOP PEMINJAM LIST ===== */
.top-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0; /* 🔥 dari default 12px jadi 6px */
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.top-item:last-child {
  border-bottom: none;
}

.top-rank {
  width: 24px;
  height: 24px;
  background: var(--primary);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.top-name {
  flex: 1;
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.top-amount {
  color: var(--primary);
  font-weight: 600;
  white-space: nowrap;
}

.top-empty {
  text-align: center;
  padding: 20px;
  color: var(--muted);
  font-size: 13px;
}

/* ===== MOBILE ===== */
@media (max-width:480px){
  .top-item {
    padding: 5px 0; /* 🔥 lebih rapet di HP */
    font-size: 12px;
  }

  .top-rank {
    width: 22px;
    height: 22px;
    font-size: 10px;
  }
}
/* ===== CANVAS ===== */
canvas {
  max-width: 100% !important;
  height: auto !important;
  display: block;
}

/* ===== SIDEBAR ===== */
/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 240px;
  height: 100vh;
  background: var(--primary-dark);
  color: white;
  padding: 10px 10px; /* 🔥 kurangi padding samping */
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1000;
  overflow-y: auto;
}

.sidebar.open {
  transform: translateX(0);
  box-shadow: 4px 0 20px rgba(0,0,0,0.3);
}

.sidebar h3 {
  margin-bottom: 16px; /* 🔥 dari 20px jadi 16px */
  font-size: 18px;
  font-weight: 700;
  padding: 0 8px 10px 8px; /* 🔥 tambah padding kiri kanan */
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.sidebar a {
  display: flex; /* 🔥 pake flex biar icon + text rapi */
  align-items: center;
  gap: 10px; /* 🔥 jarak icon ke text */
  color: #cbd5e1;
  text-decoration: none;
  padding: 9px 12px; /* 🔥 dari 12px 14px jadi 9px 12px */
  border-radius: 8px;
  margin-bottom: 2px; /* 🔥 dari 6px jadi 2px biar rapet */
  font-size: 13px; /* 🔥 dari 14px jadi 13px */
  font-weight: 500;
  transition: all 0.2s ease;
  cursor: pointer;
}

.sidebar a:hover {
  background: var(--primary);
  color: white;
  transform: translateX(3px); /* 🔥 dari 4px jadi 3px */
}

.sidebar a.hidden {
  display: none;
}

/* Separator buat grup menu */
.sidebar .divider {
  height: 1px;
  background: rgba(255,255,255,0.1);
  margin: 10px 8px; /* 🔥 gap antar grup menu */
}
  /* ===== HEADER RIGHT ===== */
.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== USER BADGE ===== */
.user-badge {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 500;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-badge:hover {
  background: rgba(255,255,255,0.25);
  transform: translateY(-1px);
}

.user-badge::before {
  content: "👋 ";
  margin-right: 4px;
}

/* ===== MOBILE ===== */
@media (max-width:480px){
  

  .title {
    font-size: 12px;
  }

  .header-right {
    gap: 6px;
  }

  .user-badge {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-badge b {
  font-weight: 700;
}

@media (max-width:480px){
  .user-badge {
    font-size: 11px;
    padding: 5px 10px;
    max-width: 110px;
    background: rgba(255,255,255,0.2);
  }
}

  
  .overlay{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 999;
}
  /* ===== SALDO ===== */
.saldo-card{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.saldo-item{
  background:#f1f5f9;
  padding:14px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
}

.saldo-item h2{
  margin:0;
  font-size:12px;
  color:var(--primary);
}

.saldo-total{
  font-size:12px;
  background:linear-gradient(135deg,#1e90ff,#0f3057);
  color:white;
  padding:18px;
  border-radius:6px;
  text-align:center;
}

.saldo-total h1{
  margin-top:4px;
  font-size:12px;
}
  </style>
</head>
<body>
  
<!-- SIDEBAR -->
  <div id="sidebar" class="sidebar">
  <h3>Menu Koperasi</h3>
    
<a href="anggota.html" class="menu-admin">👤anggota</a>
<a href="kas.html" class="menu-admin">💰 kas</a>
<a href="simpanan.html" class="menu-admin">📄 Simpanan</a>
<a href="backup.html" class="menu-admin">📊 backup Kas</a>

  <a href="pinjaman.html" class="menu-admin">💰 Pinjaman</a>
<a href="angsuran.html" class="menu-admin">📄 Angsuran</a>
<a href="neraca.html">📊 Laporan Kas</a>
<a href="laporan-anggota.html">📊 Laporan Anggota</a>
    <a href="user.html" id="menuUser" class="menu-admin">👤 Kelola User</a>
  <a href="#" id="btnLogoutSide">🚪 Logout</a>
</div>


<!-- OVERLAY -->
<div id="overlay" class="overlay"></div>

  <header>
  <div style="display:flex;align-items:center;">
    <span onclick="toggleSidebar()" class="menu-btn">☰</span>
    <span class="title">Dashboard koperasi</span>
  </div>
  <div class="header-right">
    <div id="userDisplay" class="user-badge">Halo</div>
    </div>
</header>
  
  <div class="card saldo-card">
  <div class="saldo-item">
    <span>💵 Cash</span>
    <h2 id="saldoCash">Rp 0</h2>
  </div>

  <div class="saldo-item">
    <span>🏦 Bank</span>
    <h2 id="saldoBank">Rp 0</h2>
  </div>

  <div class="saldo-total">
    <span>💰 Total Kas</span>
    <h1 id="saldoTotal">Rp 0</h1>
  </div>
</div>
  


<div class="card">
<h3>Grafik Angsuran per Bulan</h3>
<canvas id="chartAngsuran"></canvas>
</div>

<div class="card">
<h3>Grafik Pelunasan Pinjaman</h3>
<canvas id="chartPelunasan"></canvas>
</div>

<div class="card">
<h3>Top Peminjam</h3>
<div id="topPeminjam" class="top-list"></div>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",
authDomain:"arfa-c7dee.firebaseapp.com",
databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",
projectId:"arfa-c7dee",
storageBucket:"arfa-c7dee.appspot.com",
messagingSenderId:"468058520812",
appId:"1:468058520812:web:f9cbc82fe7e88ecda9b9c9"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const pinjamanRef=ref(db,"/pinjaman");
const angsuranRef=ref(db,"/angsuran");
const kasRef = ref(db,"/kas");

onValue(kasRef, snapshot=>{
  let cash = 0;
  let bank = 0;

  if(snapshot.exists()){
    const data = snapshot.val();

    for(const k in data){
      const item = data[k];

      const jumlah = Number(item.jumlah) || 0;
      const tipe = item.tipe || "masuk";
      const sumber = item.sumberKas || "cash";

      if(sumber === "cash"){
        if(tipe === "masuk") cash += jumlah;
        else cash -= jumlah;
      }

      if(sumber === "bank"){
        if(tipe === "masuk") bank += jumlah;
        else bank -= jumlah;
      }
    }
  }

  document.getElementById("saldoCash").innerText =
    "Rp " + cash.toLocaleString("id-ID");

  document.getElementById("saldoBank").innerText =
    "Rp " + bank.toLocaleString("id-ID");

  document.getElementById("saldoTotal").innerText =
    "Rp " + (cash + bank).toLocaleString("id-ID");
});
let dataPinjaman={}, dataAngsuran={};
let chartAngsuran, chartPelunasan;

// ===== ROLE MENU =====
const role = localStorage.getItem("role");

// kalau bukan admin → sembunyikan menu admin
if(role !== "admin"){
  document.querySelectorAll(".menu-admin").forEach(el=>{
    el.style.display = "none";
  });
}

if(role === "admin"){
  document.getElementById("menuUser").style.display = "block";
} 
  document.addEventListener("DOMContentLoaded", () => {
  const username = localStorage.getItem("username");
  const el = document.getElementById("userDisplay");

  const jam = new Date().getHours();
  let salam = "Halo";

  if(jam < 11) salam = "Pagi";
else if(jam < 15) salam = "Siang"; 
else if(jam < 18) salam = "Sore";
else salam = "Malam";

el.innerHTML = `${salam} <b>${username || 'User'}</b>`;

  // Mobile cuma icon + username, Desktop baru pake salam
  const isMobile = window.innerWidth < 480;
  
  if (isMobile) {
    el.innerHTML = `👤 <b>${username || 'User'}</b>`;
  } else {
    el.innerHTML = `${salam}, <b>${username || 'User'}</b>`;
  }
});
// SIDEBAR TOGGLE
window.toggleSidebar = function(){
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");

  const isOpen = sidebar.classList.contains("open");

  if(isOpen){
    sidebar.classList.remove("open");
    overlay.style.display = "none";
  }else{
    sidebar.classList.add("open");
    overlay.style.display = "block";
  }
};
  
// klik overlay untuk tutup
document.getElementById("overlay").addEventListener("click", toggleSidebar);

// logout dari sidebar
document.getElementById("btnLogoutSide").addEventListener("click", logout);
  
  
  function logout(){
  if(confirm("Yakin ingin logout?")){
    document.body.style.opacity = "0.5";

    setTimeout(()=>{
      localStorage.removeItem("login");
      localStorage.removeItem("username");
      localStorage.removeItem("role");

      window.location.href = "index.html";
    }, 300);
  }
}

function gotoPage(page){
  window.location.href = page;
}

function rupiah(n){return n.toLocaleString("id-ID",{style:"currency",currency:"IDR"});}

/* LOAD DATA */
onValue(pinjamanRef,snap=>{
dataPinjaman={};
snap.forEach(d=>{dataPinjaman[d.key]=d.val()});
renderDashboard();
});

onValue(angsuranRef,snap=>{
dataAngsuran={};
snap.forEach(d=>{dataAngsuran[d.key]=d.val()});
renderDashboard();
});

function renderDashboard(){
grafikAngsuran();
grafikPelunasan();
topPeminjam();
}

function grafikAngsuran(){
let bulan={};
Object.values(dataAngsuran).forEach(a=>{
let t=new Date(a.tanggal);
let key=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0");
bulan[key]=(bulan[key]||0)+a.jumlah;
});
let labels=Object.keys(bulan);
let data=Object.values(bulan);
if(chartAngsuran) chartAngsuran.destroy();
chartAngsuran=new Chart(document.getElementById("chartAngsuran"),{type:"bar",data:{labels, datasets:[{label:"Angsuran",data}]}});  
}

function grafikPelunasan(){
let labels=[], data=[];
Object.entries(dataPinjaman).forEach(([pinId,p])=>{
let totalPinjaman = p.jumlah||0, totalAngsuran=0;
Object.values(dataAngsuran).forEach(a=>{if(a.pinjamanId===pinId) totalAngsuran+=a.jumlah||0;});
let persen=totalPinjaman? (totalAngsuran/totalPinjaman)*100:0;
labels.push(p.nama);
data.push(persen);
});
if(chartPelunasan) chartPelunasan.destroy();
chartPelunasan=new Chart(document.getElementById("chartPelunasan"),{type:"line",data:{labels,datasets:[{label:"% Pelunasan",data}]}});  
}
function topPeminjam(){
  let map={};
  Object.values(dataPinjaman).forEach(p=>{
    map[p.nama]= (map[p.nama]||0)+p.jumlah;
  });
  let arr=Object.entries(map).map(([nama,jumlah])=>({nama,jumlah}))
    .sort((a,b)=>b.jumlah-a.jumlah)
    .slice(0,10);
  
  let html=arr.map((p,i)=>`
    <div class="top-item">
      <span class="top-rank">${i+1}</span>
      <span class="top-name">${p.nama}</span>
      <span class="top-amount">${rupiah(p.jumlah)}</span>
    </div>
  `).join('');
  
  if(!html) html="<div class='top-empty'>Tidak ada anggota</div>";
  document.getElementById("topPeminjam").innerHTML=html;
}
</script>
</body>
</html>
