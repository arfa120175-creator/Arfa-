<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas Koperasi</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --primary: #1e90ff;
  --primary-dark: #0f3057;
  --card: #ffffff;
  --bg: #f4f6f9;
  --text: #1f2937;
}

/* ===== BASE ===== */
html, body {
  margin:0;
  padding:0;
}



/* ===== HEADER ===== */
header {
  background: linear-gradient(to right, var(--primary), var(--primary-dark));
  color: white;
  padding: 14px;
  font-size: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.menu-btn {
  font-size: 22px;
  cursor: pointer;
  margin-right: 10px;
}

/* ===== CONTAINER ===== */
.container {
  padding: 16px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.card {
  background: white;
  padding: 14px;
  border-radius: 10px;
}

  header{
  background: linear-gradient(to right, #1e90ff, #0f3057);
  color:white;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.2);
}


.brand {
  display: flex;
  align-items: center;
  gap: 20px;
}

.brand img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
}

.brand-text .subtitle {
  font-size: 12px;
  opacity: 0.9;
}

.brand-text .title {
  font-size: 16px;
  font-weight: bold;
}

.container {
  padding: 15px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 3px 8px rgba(0,0,0,.08);
}

input, select {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  background: #1e90ff;
  color: white;
  cursor: pointer;
  margin-right: 5px;
}

.total div {
  margin-bottom: 6px;
}

table {
   
  width: 100%;
  border-collapse: collapse;
}

table th, table td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  text-align: left;
  font-size: 10px
}

table th {
  background: #f0f0f0;
  
}

.masuk { color: green; font-weight: bold; }
.keluar { color: red; font-weight: bold; }

/* Modal */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0; top: 0;
  width: 100%; height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background-color: #fff;
  padding: 20px;
  border-radius: 8px;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.3);
  max-height: 90vh;
  overflow-y: auto;
}

.modal-content h3 {
  margin-top: 0;
}

.modal-content button {
  margin-top: 10px;
}
  /* ===== SIDEBAR ===== */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 220px;
  height: 100%;
  background: var(--primary-dark);
  color: white;
  padding: 20px;
  transform: translateX(-100%);
  transition: 0.3s;
  z-index: 1000;
}

.sidebar.open {
  transform: translateX(0);
}

.sidebar h3 {
  margin-bottom: 15px;
}

.sidebar a {
  display: block;
  color: white;
  text-decoration: none;
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}

.sidebar a:hover {
  background: var(--primary);
  transform: translateX(4px);
}

/* ===== OVERLAY ===== */

.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 999;
}
/* ===== CANVAS ===== */
canvas {
  max-width: 100% !important;
  height: auto !important;
}

/* ===== TOP LIST ===== */
.top-list div {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #eee;
}

/* ===== MOBILE ===== */
@media(min-width:700px){
  .grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>
<body>
  <!-- SIDEBAR -->
  <div id="sidebar" class="sidebar">
  <h3>Menu</h3>
<a href="kas.html" class="menu-admin">💰 kas</a>
<a href="simpanan.html" class="menu-admin">📄 Simpanan</a>
<a href="backup.html" class="menu-admin">📊 backup Kas</a>

  <a href="pinjaman.html" class="menu-admin">💰 Pinjaman</a>
<a href="angsuran.html" class="menu-admin">📄 Angsuran</a>
<a href="neraca.html">📊 Laporan Kas</a>
<a href="laporan-anggota.html">📊 Laporan Anggota</a>
    <a href="user.html" id="menuUser" class="menu-admin">👤 Kelola User</a>
  <a href="#" id="btnLogoutSide">🚪 Logout</a>
</div>

  

<!-- OVERLAY -->
<div id="overlay" class="overlay"></div>

<header>
  <div>
    <span onclick="toggleSidebar()" class="menu-btn">☰</span>
    Dashboard
  </div>
  <div id="userDisplay">👤 User</div>
</header>




  <div class="container">

  <div class="card total">
    <div>Cash : Rp <span id="saldoCash">0</span></div>
    <div>Bank : Rp <span id="saldoBank">0</span></div>
    <hr>
    <div>Kas Masuk : Rp <span id="totalMasuk">0</span></div>
    <div>Kas Keluar : Rp <span id="totalKeluar">0</span></div>
    <hr>
    <div>Total Saldo : Rp <span id="saldoTotal">0</span></div>
  </div>

  <div class="card">
    <h3>Input Kas</h3>
    <select id="sumberKas">
      <option value="cash">Cash</option>
      <option value="bank">Bank</option>
    </select>
    <select id="tipe">
      <option value="masuk">Kas Masuk</option>
      <option value="keluar">Kas Keluar</option>
    </select>
    <input type="datetime-local" id="tanggal">
    <input type="number" id="jumlah" placeholder="Jumlah">
    <input type="text" id="keterangan" placeholder="Keterangan">
    <button id="btnSimpan">Simpan</button>
  </div>

  <div class="card">
    <h3>Riwayat Transaksi</h3>
    <table id="riwayatTable">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Tipe</th>
          <th>Sumber</th>
          <th>Jumlah</th>
          <th>Keterangan</th>
        </tr>
      </thead>
      <tbody id="riwayat"></tbody>
    </table>
  </div>

</div>

<!-- Modal Edit Kas -->
<div class="modal" id="modalEditKas">
  <div class="modal-content">
    <h3>Edit Transaksi Kas</h3>
    <input type="hidden" id="editKasKey">
    <label>Sumber Kas</label>
    <select id="editKasSumber">
      <option value="cash">Cash</option>
      <option value="bank">Bank</option>
    </select>
    <label>Tipe</label>
    <select id="editKasTipe">
      <option value="masuk">Kas Masuk</option>
      <option value="keluar">Kas Keluar</option>
    </select>
    <label>Jumlah</label>
    <input type="number" id="editKasJumlah">
    <label>Tanggal</label>
    <input type="datetime-local" id="editKasTanggal">
    <label>Keterangan</label>
    <input type="text" id="editKasKeterangan">
    <button onclick="updateKas()">Simpan</button>
    <button onclick="hapusKasModal()">Hapus</button>
    <button onclick="tutupModalKas()">Tutup</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",
  authDomain: "arfa-c7dee.firebaseapp.com",
  databaseURL: "https://arfa-c7dee-default-rtdb.firebaseio.com",
  projectId: "arfa-c7dee"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
/* ===== SIDEBAR ===== */
window.toggleSidebar = function(){
  const s = document.getElementById("sidebar");
  const o = document.getElementById("overlay");

  if(s.classList.contains("open")){
    s.classList.remove("open");
    o.style.display = "none";
  } else {
    s.classList.add("open");
    o.style.display = "block";
  }
};

document.getElementById("overlay")
  .addEventListener("click", toggleSidebar);

/* ===== LOGOUT ===== */
document.getElementById("btnLogoutSide")
  .addEventListener("click", ()=>{
    localStorage.clear();
    location.href="index.html";
  });
// Role check
const role = localStorage.getItem("role") || "username";
if(role !== "admin") {
  document.querySelector("#btnSimpan").style.display="none";
  document.querySelector("#jumlah").disabled=true;
  document.querySelector("#keterangan").disabled=true;
  document.querySelector("#tipe").disabled=true;
  document.querySelector("#sumberKas").disabled=true;
  document.querySelector("#tanggal").disabled=true;
}
/* 👋 USER INFO */
document.addEventListener("DOMContentLoaded", () => {
  const el = document.getElementById("userDisplay");

  const username = localStorage.getItem("username");
  const role = localStorage.getItem("role");

  console.log("LOGIN DATA:", username, role);

  if(!username || !role){
    el.innerHTML = "⚠️ Belum login";
    return;
  }

  const jam = new Date().getHours();
  let salam = jam < 11 ? "Pagi" :
              jam < 15 ? "Siang" :
              jam < 18 ? "Sore" : "Malam";

  el.innerHTML = `${salam}, <b>${username}</b> (${role})`;
});
// References
const kasRef = ref(db,"kas");

let editKey = null;
let saldoCash = 0, saldoBank = 0, totalMasuk = 0, totalKeluar = 0;

// Format Rupiah
function formatRp(n){ return Number(n||0).toLocaleString("id-ID"); }

// Simpan Kas
document.getElementById("btnSimpan").onclick = async()=>{
  const sumberKas = document.getElementById("sumberKas").value;
  const tipe = document.getElementById("tipe").value;
  const jumlah = Number(document.getElementById("jumlah").value);
  const ket = document.getElementById("keterangan").value;
  const tanggalInput = document.getElementById("tanggal").value;

  if(!jumlah){ alert("Jumlah wajib diisi"); return; }

  if(tipe==="keluar"){
    if(sumberKas==="cash" && jumlah>saldoCash){ alert("Saldo CASH tidak cukup"); return; }
    if(sumberKas==="bank" && jumlah>saldoBank){ alert("Saldo BANK tidak cukup"); return; }
  }

  const tanggal = tanggalInput ? new Date(tanggalInput).getTime() : Date.now();

  if(editKey){
    await update(ref(db,"kas/"+editKey), { sumberKas, tipe, jumlah, keterangan: ket||"Transaksi Kas", tanggal });
    editKey = null;
    alert("Data berhasil diupdate");
  } else {
    await push(kasRef, { sumberKas, tipe, jumlah, keterangan: ket||"Transaksi Kas", tanggal });
    alert("Data berhasil disimpan");
  }

  document.getElementById("jumlah").value="";
  document.getElementById("keterangan").value="";
}

  
// Load dan tampilkan kas
onValue(kasRef, snap => {
  saldoCash = 0;
  saldoBank = 0;
  totalMasuk = 0;
  totalKeluar = 0;

  const riwayat = document.getElementById("riwayat");
  riwayat.innerHTML = "";

  if (!snap.exists()) return;

  const data = Object.entries(snap.val())
    .sort((a, b) => Number(b[1].tanggal) - Number(a[1].tanggal));

  data.forEach(([key, i]) => {
    const jumlah = Number(i.jumlah) || 0;
    const tipe = String(i.tipe || "masuk").toLowerCase();
    const sumber = String(i.sumberKas || "cash").toLowerCase();
    const tanggal = i.tanggal
      ? new Date(Number(i.tanggal)).toLocaleString("id-ID")
      : "-";

    // hitung total
    if (tipe === "masuk") totalMasuk += jumlah;
    else totalKeluar += jumlah;

    if (sumber === "cash") {
      tipe === "masuk" ? saldoCash += jumlah : saldoCash -= jumlah;
    }
    if (sumber === "bank") {
      tipe === "masuk" ? saldoBank += jumlah : saldoBank -= jumlah;
    }

    // 🔥 RINCIAN (POKOK & JASA)
    let rincianHtml = "";
    if (i.rincian) {
      const pokok = Number(i.rincian.pokok) || 0;
      const jasa = Number(i.rincian.jasa) || 0;

      rincianHtml = `
        <div style="font-size:11px;color:#666;margin-top:4px;">
          Pokok: Rp ${formatRp(pokok)} |
          Jasa: Rp ${formatRp(jasa)}
        </div>
      `;
    }

    // render row
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${tanggal}</td>
      <td class="${tipe}">${tipe.toUpperCase()}</td>
      <td>${sumber.toUpperCase()}</td>
      <td>Rp ${formatRp(jumlah)}</td>
      <td>
        ${i.keterangan || "-"}
        ${rincianHtml}
      </td>
    `;

    // klik edit (admin)
    if (role === "admin") {
      tr.style.cursor = "pointer";
      tr.addEventListener("click", () => editKas(key));
    }

    riwayat.appendChild(tr);
  });

  // update dashboard
  document.getElementById("saldoCash").innerText = formatRp(saldoCash);
  document.getElementById("saldoBank").innerText = formatRp(saldoBank);
  document.getElementById("totalMasuk").innerText = formatRp(totalMasuk);
  document.getElementById("totalKeluar").innerText = formatRp(totalKeluar);
  document.getElementById("saldoTotal").innerText = formatRp(saldoCash + saldoBank);
});

// Modal Edit Kas
window.editKas = async function(key){
  const snap = await get(ref(db, "kas/"+key));
  const d = snap.val();
  if(!d) return;

  editKey = key;
  document.getElementById("editKasKey").value = key;
  document.getElementById("editKasSumber").value = d.sumberKas || "cash";
  document.getElementById("editKasTipe").value = d.tipe || "masuk";
  document.getElementById("editKasJumlah").value = d.jumlah || 0;
  document.getElementById("editKasKeterangan").value = d.keterangan || "";

  if(d.tanggal){
    const t = new Date(d.tanggal);
    const iso = new Date(t.getTime()-t.getTimezoneOffset()*60000).toISOString().slice(0,16);
    document.getElementById("editKasTanggal").value = iso;
  }

  document.getElementById("modalEditKas").style.display = "flex";
}

window.tutupModalKas = function(){ document.getElementById("modalEditKas").style.display = "none"; }

window.updateKas = async function(){
  const key = document.getElementById("editKasKey").value;
  const sumber = document.getElementById("editKasSumber").value;
  const tipe = document.getElementById("editKasTipe").value;
  const jumlah = Number(document.getElementById("editKasJumlah").value);
  const keterangan = document.getElementById("editKasKeterangan").value;
  const tanggalInput = document.getElementById("editKasTanggal").value;
  const tanggal = tanggalInput ? new Date(tanggalInput).getTime() : Date.now();

  if(!key) return alert("Data tidak ditemukan");
  if(!jumlah) return alert("Jumlah wajib diisi");

  await update(ref(db,"kas/"+key), { sumberKas: sumber, tipe, jumlah, keterangan: keterangan||"Transaksi Kas", tanggal });
  alert("Data berhasil diperbarui");
  tutupModalKas();
}

window.hapusKasModal = async function(){
  const key = document.getElementById("editKasKey").value;
  if(!key) return;
  if(confirm("Yakin ingin menghapus transaksi ini?")){
    await remove(ref(db,"kas/"+key));
    alert("Data berhasil dihapus");
    tutupModalKas();
  }
}
    /* ================= KEMBALI ================= */
window.kembali = function(){
  window.location.href="dash.html";
}
</script>

</body>
</html>
