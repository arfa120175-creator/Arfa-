<!DOCTYPE html>  <html lang="id">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Data Pinjaman</title>  
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">  
  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script> 
  
  <style>  
body{font-family:Arial;margin:0;background:#f4f6f9;scroll-behavior:smooth;}  
header{background:linear-gradient(to right,#1e90ff,#0f3057);color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}  
.container{padding:10px;}  
.card{font-size:14px;background:white;padding:12px;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}  
input,select{width:100%;padding:8px;margin-top:5px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;}  
button{padding:8px 12px;border:none;border-radius:6px;cursor:pointer;background:#1e90ff;color:white;}  
.icon-btn{border:none;background:none;cursor:pointer;font-size:20px;margin:0 3px;}  
.icon-edit{color:#ffc107;}  
.icon-delete{color:#dc3545;}  
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:999;padding:10px;}  
.popup-box{background:white;padding:20px;border-radius:10px;width:300px;max-width:90%;max-height:90vh;overflow-y:auto;}  
.brand{display:flex;align-items:center;gap:10px;}  
.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;}  
.brand-text .subtitle{font-size:12px;opacity:0.9;}  
.brand-text .title{font-size:14px;font-weight:bold;}  
h3{text-align:center}  
.total{font-weight:bold;margin-bottom:10px;}  
</style>  </head>  <body>  
<header>  
<div class="brand">  
<img src="img/icon-192.png">  
<div class="brand-text">  
<div class="subtitle">Koperasi</div>  
<div class="title">ARFA DRIVER</div>  
</div>  
</div>  
<div>👥 Data Peminjam</div>  
<button onclick="kembali()">Kembali</button>  
</header>   
  
  <div class="container"> 
    <div class="card">  
  <b>Saldo Kas</b><br>  
  Rp <span id="saldoKas">0</span>  
</div>  
    <div class="card">
  <b>Total Pinjaman</b><br>
  Rp <span id="totalPinjaman">0</span>
</div>
    <button onclick="perbaikiNomorDuplikat()">Perbaiki Nomor Dobel</button>
    <button onclick="resetNomorPinjaman()">Reset Nomor</button>
    <div class="card" id="formPinjaman">  
<h3>Tambah Pinjaman</h3>  <label>Anggota</label>
<select id="anggota"></select>

<label>No Pinjaman</label>
<input type="text" id="noPinjaman"  value="Loading...">

<label>Tanggal</label>
<input type="date" id="tanggal">

<label>Metode</label>
<select id="metode">

  <option value="">Pilih metode</option>  
  <option value="cash">Cash</option>  
  <option value="bank">Bank</option>  
  <option value="e-wallet">E-Wallet</option>  
  <option value="lainnya">Lainnya</option>  
</select>  <label>Jumlah</label>
<input type="number" id="jumlah" min="1">
<label>Jasa</label>
<input type="number" id="jasa" min="0" value="0">
<label>Keterangan</label>
<input type="text" id="ket">

<button onclick="simpanPinjaman()">Simpan</button>

</div>  <!-- FILTER -->  <div class="card">  
<h3>Filter Data</h3>  <select id="filterMetode" onchange="renderPinjaman()">  
  <option value="">Semua Metode</option>  
  <option value="cash">Cash</option>  
  <option value="bank">Bank</option>  
  <option value="e-wallet">E-Wallet</option>  
  <option value="lainnya">Lainnya</option>  
</select>  </div>  <div class="card">  
<h3>Daftar Pinjaman</h3>  
<div id="tabelPinjaman"></div>  
</div>  </div>  <div id="popupEdit" class="popup">  
<div class="popup-box">  
<h3>Edit Pinjaman</h3>  
<label>No Pinjaman</label>  
<input type="text" id="editNoPinjaman">  
<label>Anggota</label>  
<select id="editAnggota"></select>  
<label>Tanggal</label>  
<input type="date" id="editTanggal">  
<label>Metode</label>  <select id="editMetode">  
  <option value="cash">Cash</option>  
  <option value="bank">Bank</option>  
  <option value="e-wallet">E-Wallet</option>  
  <option value="lainnya">Lainnya</option>  
</select>  <label>Jumlah</label>
<input type="number" id="editJumlah">
<label>Keterangan</label>
<input type="text" id="editKet">
<br><br>
<button onclick="updatePinjaman()">Update</button>
<button onclick="tutupPopup()">Batal</button>

</div>  
</div>  
  
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, push, onValue, update, remove, get, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ================= CONFIG =================
const firebaseConfig = {
  apiKey: "AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",
  authDomain: "arfa-c7dee.firebaseapp.com",
  databaseURL: "https://arfa-c7dee-default-rtdb.firebaseio.com",
  projectId: "arfa-c7dee"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ================= REF =================
const anggotaRef = ref(db, "anggota");
const pinjamanRef = ref(db, "pinjaman");
const kasRef = ref(db, "kas");

// ================= ROLE =================
const role = localStorage.getItem("role") || "user";
if (!localStorage.getItem("role")) {
  alert("Silakan login dulu");
  window.location.href = "index.html";
}

// ================= VAR =================
let dataPinjaman = {};
let dataAnggota = {};
let editId = null;
let kasIdLama = null;
let sedangRepair = false;
let repairTimeout;

const anggotaSelect = document.getElementById("anggota");
const editAnggotaSelect = document.getElementById("editAnggota");
const tabel = document.getElementById("tabelPinjaman");
const totalPinjamanEl = document.getElementById("totalPinjaman");

// ================= HELPER =================
function format(x) {
  return new Intl.NumberFormat("id-ID").format(x || 0);
}

window.kembali = function(){
  window.location.href = "dash.html";
}

window.tutupPopup = function(){
  document.getElementById("popupEdit").style.display = "none";
  editId = null;
  kasIdLama = null;
}

// ================= AUTO REPAIR =================
async function autoRepairNomor() {
  if (sedangRepair) return;
  sedangRepair = true;

  try {
    const snap = await get(pinjamanRef);
    if (!snap.exists()) return;

    let list = [];
    snap.forEach(d => {
      list.push({ id: d.key,...d.val() });
    });

    // urut tanggal
    list.sort((a, b) => (a.tanggal || 0) - (b.tanggal || 0));

    let updates = {};
    let nomorBaru = 1;
    let berubah = false;

    list.forEach(item => {
      let noBaru = "PJ" + String(nomorBaru).padStart(3, "0");

      if (item.nomor!== noBaru) {
        updates[`pinjaman/${item.id}/nomor`] = noBaru;
        berubah = true;
      }
      nomorBaru++;
    });

    if (berubah) {
      await update(ref(db), updates);
      await update(ref(db, "counter"), {
        pinjaman: nomorBaru - 1
      });
      console.log("Auto repair jalan");
    }

  } catch (err) {
    console.error(err);
  }

  sedangRepair = false;
}

// delay biar ga spam
function triggerAutoRepair() {
  clearTimeout(repairTimeout);
  repairTimeout = setTimeout(() => {
    autoRepairNomor();
  }, 500);
}

// ================= NO PINJAMAN =================
async function getNoPinjaman() {
  const counterRef = ref(db, "counter/pinjaman");

  let result = await runTransaction(counterRef, (current) => {
    return (current || 0) + 1;
  });

  let no = result.snapshot.val();
  return "PJ" + String(no).padStart(3, "0");
}

async function loadNoPinjaman() {
  const snap = await get(pinjamanRef);
  let max = 0;

  snap.forEach(d => {
    let nomor = d.val().nomor || "";
    let n = Number(nomor.replace("PJ", ""));
    if (n > max) max = n;
  });

  let next = max + 1;
  document.getElementById("noPinjaman").value = "PJ" + String(next).padStart(3, "0");
}

// ================= LOAD ANGGOTA =================
onValue(anggotaRef, snap => {
  dataAnggota = snap.val() || {};
  anggotaSelect.innerHTML = "<option value=''>Pilih anggota</option>";
  editAnggotaSelect.innerHTML = "<option value=''>Pilih anggota</option>";

  snap.forEach(d => {
    let a = d.val();
    let opt = `<option value="${d.key}">${a.nama}</option>`;
    anggotaSelect.innerHTML += opt;
    editAnggotaSelect.innerHTML += opt;
  });
});

// ================= RENDER =================
onValue(pinjamanRef, snap => {
  triggerAutoRepair(); // 🔥 auto jalan

  tabel.innerHTML = "";
  dataPinjaman = {};
  let total = 0;

  let list = [];
  snap.forEach(d => {
    list.push({ id: d.key,...d.val() });
  });

  // urut nomor
  list.sort((a, b) => {
    let na = Number((a.nomor || "").replace("PJ", ""));
    let nb = Number((b.nomor || "").replace("PJ", ""));
    return na - nb;
  });

  // filter metode
  const filterMetode = document.getElementById("filterMetode").value;

  list.forEach(p => {
    if(filterMetode && p.sumberKas!== filterMetode) return;

    let id = p.id;
    let jumlah = Number(p.jumlah || 0);
    let jasa = Number(p.jasa || 0);
    let totalPinj = jumlah + jasa;

    total += totalPinj;
    dataPinjaman[id] = p;

    let tgl = p.tanggal
     ? new Date(Number(p.tanggal)).toLocaleDateString("id-ID")
      : "-";

    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
    <div style="display:flex;justify-content:space-between">
      <div><b>${p.nomor || "-"}</b></div>
      <div>${p.sumberKas || ""}</div>
    </div>
    <div>Anggota : ${p.nama}</div>
    <div>Tanggal : ${tgl}</div>
    <div>Jumlah : Rp ${format(jumlah)}</div>
    <div>Jasa : Rp ${format(jasa)}</div>
    <div><b>Total : Rp ${format(totalPinj)}</b></div>
    <div>Ket : ${p.ket || '-'}</div>

    <div style="text-align:right;margin-top:8px">
      ${role === "admin"? `
      <button onclick="editPinjaman('${id}')">Edit</button>
      <button style="background:#dc3545" onclick="hapusPinjaman('${id}')">Hapus</button>
      ` : ""}
    </div>
    `;

    tabel.appendChild(card);
  });

  totalPinjamanEl.innerText = format(total);
});

// ================= SIMPAN =================
window.simpanPinjaman = async function() {
  if (role!== "admin") return alert("Hanya admin");

  try {
    let idAnggota = anggotaSelect.value;
    let nama = anggotaSelect.options[anggotaSelect.selectedIndex]?.text || "";
    let tanggalInput = document.getElementById("tanggal").value;
    let jumlah = Number(document.getElementById("jumlah").value);
    let jasa = Number(document.getElementById("jasa").value) || 0;
    let metode = document.getElementById("metode").value;
    let ket = document.getElementById("ket").value;

    if (!idAnggota) return alert("Pilih anggota!");
    if (!tanggalInput) return alert("Isi tanggal!");
    if (!metode) return alert("Pilih metode!");
    if (!jumlah || jumlah <= 0) return alert("Jumlah harus > 0!");

    let nomor = await getNoPinjaman();
    let tanggal = new Date(tanggalInput).getTime();

    // 1. Simpan kas keluar dulu
    let kas = await push(kasRef, {
      tanggal,
      keterangan: "Pinjaman " + nama + " (" + nomor + ")",
      tipe: "keluar",
      sumberKas: metode,
      jumlah: jumlah + jasa,
      rincian: { pokok: jumlah, jasa: jasa }
    });

    // 2. Simpan pinjaman
    await push(pinjamanRef, {
      nomor,
      idAnggota,
      nama,
      tanggal,
      jumlah,
      jasa,
      sumberKas: metode,
      ket,
      kasId: kas.key
    });

    alert("Berhasil ✅");

    document.getElementById("jumlah").value = "";
    document.getElementById("jasa").value = "0";
    document.getElementById("ket").value = "";

    loadNoPinjaman();

  } catch (err) {
    alert("Gagal: " + err.message);
  }
}

// ================= EDIT =================
window.editPinjaman = function(id){
  if (role!== "admin") return alert("Hanya admin");

  const p = dataPinjaman[id];
  if(!p) return;

  editId = id;
  kasIdLama = p.kasId;

  document.getElementById("editNoPinjaman").value = p.nomor || "";
  document.getElementById("editAnggota").value = p.idAnggota || "";
  document.getElementById("editTanggal").value = p.tanggal?
    new Date(Number(p.tanggal)).toISOString().split("T")[0] : "";
  document.getElementById("editMetode").value = p.sumberKas || "";
  document.getElementById("editJumlah").value = p.jumlah || 0;
  document.getElementById("editKet").value = p.ket || "";

  document.getElementById("popupEdit").style.display = "flex";
}

// ================= UPDATE =================
window.updatePinjaman = async function(){
  if(!editId) return;
  if (role!== "admin") return alert("Hanya admin");

  try {
    let idAnggota = document.getElementById("editAnggota").value;
    let nama = document.getElementById("editAnggota").options[document.getElementById("editAnggota").selectedIndex]?.text || "";
    let tanggalInput = document.getElementById("editTanggal").value;
    let jumlah = Number(document.getElementById("editJumlah").value);
    let metode = document.getElementById("editMetode").value;
    let ket = document.getElementById("editKet").value;
    let nomor = document.getElementById("editNoPinjaman").value;

    if (!idAnggota) return alert("Pilih anggota!");
    if (!tanggalInput) return alert("Isi tanggal!");
    if (!metode) return alert("Pilih metode!");
    if (!jumlah || jumlah <= 0) return alert("Jumlah harus > 0!");

    let tanggal = new Date(tanggalInput).getTime();

    const updates = {};

    // 1. Update pinjaman
    updates[`pinjaman/${editId}`] = {
      nomor,
      idAnggota,
      nama,
      tanggal,
      jumlah,
      jasa: dataPinjaman[editId].jasa || 0,
      sumberKas: metode,
      ket,
      kasId: kasIdLama
    };

    // 2. Update kas kalo ada
    if(kasIdLama){
      updates[`kas/${kasIdLama}/tanggal`] = tanggal;
      updates[`kas/${kasIdLama}/keterangan`] = "Pinjaman " + nama + " (" + nomor + ")";
      updates[`kas/${kasIdLama}/sumberKas`] = metode;
      updates[`kas/${kasIdLama}/jumlah`] = jumlah + (dataPinjaman[editId].jasa || 0);
      updates[`kas/${kasIdLama}/rincian/pokok`] = jumlah;
    }

    await update(ref(db), updates);

    tutupPopup();
    alert("Update berhasil ✅");

  } catch (err) {
    alert("Gagal update: " + err.message);
  }
}

// ================= HAPUS =================
window.hapusPinjaman = async function(id) {
  if (role!== "admin") return alert("Hanya admin");
  if (!confirm("Hapus pinjaman ini? Kas juga ikut kehapus!")) return;

  try {
    const p = dataPinjaman[id];
    if(!p) return;

    const updates = {};
    updates[`pinjaman/${id}`] = null;

    // Hapus kas terkait
    if(p.kasId){
      updates[`kas/${p.kasId}`] = null;
    }

    await update(ref(db), updates);
    alert("Hapus berhasil ✅");

  } catch (err) {
    alert("Gagal hapus: " + err.message);
  }
}

// ================= RESET NOMOR =================
window.resetNomorPinjaman = async function(){
  if (role!== "admin") return alert("Hanya admin");
  if (!confirm("Reset semua nomor pinjaman? Urutkan ulang dari PJ001")) return;

  await autoRepairNomor();
  alert("Reset nomor selesai");
}

// ================= PERBAIKI DUPLIKAT =================
window.perbaikiNomorDuplikat = async function(){
  if (role!== "admin") return alert("Hanya admin");
  await autoRepairNomor();
  alert("Perbaikan selesai");
}

// ================= FILTER =================
document.getElementById("filterMetode").addEventListener("change", () => {
  // trigger render ulang
  onValue(pinjamanRef, () => {});
});

// ================= INIT =================
window.onload = function () {
  loadNoPinjaman();
  document.getElementById("tanggal").value = new Date().toISOString().split("T")[0];

  // Sembunyikan form kalo bukan admin
  if(role!== "admin"){
    document.getElementById("formPinjaman").style.display = "none";
  }
};

// Klik overlay tutup popup
document.getElementById("popupEdit").addEventListener("click", function(e){
  if(e.target === this) tutupPopup();
});
</script>
</body>  
</html>
